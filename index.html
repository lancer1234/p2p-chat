<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self' https://cdnjs.cloudflare.com unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.metered.live https://p2p-chat-turn.danny950811.workers.dev wss://nos.lol wss://relay.damus.io wss://relay.primal.net wss://relay.nostr.band; img-src 'self' data:;">
    <title>📟 P2P Chat Pool Engine v1.3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://unpkg.com/nostr-tools@1.17.0/lib/nostr.bundle.js"></script>

    <style>
        :root {
            --bg: #0A0A0C;
            --panel: #121215;
            --border: #222227;
            --text: #E4E4E7;
            --text-muted: #52525B;
            --accent: #00FFCC;
            --danger: #EF4444;
            --warning: #F59E0B;
            --app-height: 100dvh;
            --app-top: 0px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
            align-items: center;
            justify-content: center;
        }

        #pin-container { width: 100%; max-width: 360px; padding: 24px; text-align: center; z-index: 200; }
        .pin-wrapper { position: relative; width: 100%; margin: 20px 0 10px 0; }
        .pin-input {
            width: 100%; background: var(--panel); border: 1px solid var(--border);
            padding: 16px; color: #FFF; font-size: 1.1rem; text-align: center;
            border-radius: 8px;
        }
        .show-pin-label { display: flex; align-items: center; justify-content: flex-end; gap: 6px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; margin-bottom: 20px; }

        .divider { border-top: 1px solid var(--border); margin: 24px 0; position: relative; }
        .divider-text { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 0 10px; font-size: 0.75rem; color: var(--text-muted); }

        #setup-container { display: none; width: 100%; max-width: 360px; padding: 24px; text-align: center; z-index: 5; }
        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; margin: 0 0 8px 0; color: #FFF; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 24px; }

        .relay-board { background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 24px; text-align: left; font-family: monospace; font-size: 0.75rem; }
        .relay-title { font-weight: bold; color: var(--text); margin-bottom: 6px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .relay-item { display: flex; align-items: center; justify-content: space-between; line-height: 1.6; color: var(--text-muted); }
        .relay-status { font-weight: bold; }
        .relay-status.ok { color: var(--accent); }
        .relay-status.sync { color: var(--warning); }
        .relay-status.fail { color: var(--danger); }

        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        button {
            background: var(--panel); color: var(--text); border: 1px solid var(--border);
            padding: 16px; border-radius: 8px; font-size: 0.95rem; font-weight: 500;
            cursor: pointer; width: 100%; transition: background 0.1s;
        }
        button:active { background: var(--border); }
        #btn-create { border-color: rgba(0, 255, 204, 0.4); color: var(--accent); }
        #btn-resume { display: none; border-color: rgba(0, 255, 204, 0.2); color: #00CCAA; font-weight: 600; }
        .btn-danger-link { background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; text-decoration: underline; margin-top: 8px; padding: 8px; }
        .btn-danger-link:hover { color: var(--danger); }

        .conversation-section { margin: 18px 0 14px; text-align: left; }
        .conversation-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding: 0 2px; }
        .conversation-title { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; }
        #chat-count { font-family: monospace; font-size: 0.7rem; color: var(--text-muted); }
        #chat-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #0D0D10; }
        .chat-empty { padding: 24px 14px; text-align: center; color: var(--text-muted); font-size: 0.78rem; line-height: 1.55; }
        .chat-row { display: flex; align-items: center; min-height: 66px; border-bottom: 1px solid var(--border); background: transparent; }
        .chat-row:last-child { border-bottom: none; }
        .chat-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; padding: 11px 10px 11px 12px; border: 0; border-radius: 0; background: transparent; text-align: left; }
        .chat-open:active { background: var(--panel); }
        .chat-avatar { width: 34px; height: 34px; flex: 0 0 34px; border: 1px solid #2D2D32; border-radius: 50%; display: grid; place-items: center; color: var(--accent); font-family: monospace; font-size: 0.72rem; background: var(--panel); }
        .chat-main { min-width: 0; flex: 1; }
        .chat-topline { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
        .chat-name { color: var(--text); font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-time { flex: 0 0 auto; color: var(--text-muted); font-size: 0.66rem; font-family: monospace; }
        .chat-preview { margin-top: 4px; color: var(--text-muted); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-delete { width: auto; flex: 0 0 auto; border: 0; border-left: 1px solid var(--border); border-radius: 0; background: transparent; color: #3F3F46; padding: 22px 12px; font-size: 0.9rem; }
        .chat-delete:hover { color: var(--danger); }
        #btn-new-chat { margin-top: 10px; border-color: rgba(0,255,204,0.35); color: var(--accent); }
        #pair-actions { display: none; margin-top: 10px; gap: 8px; }
        #pair-actions button { padding: 12px; font-size: 0.82rem; }
        #chat-peer-name { font-size: 0.72rem; color: var(--text); font-weight: 600; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        #reader { width: 100%; max-width: 320px; margin: 20px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: none; }
        #qrcode-container { margin: 20px auto; width: 85vw; max-width: 340px; background: #FFF; padding: 24px; border-radius: 16px; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.6); text-align: center; }
        #qrcode-container h3 { color: #0A0A0C; font-size: 0.85rem; font-weight: 600; margin: 0 0 16px 0; }
        #qrcode-container img { width: 100% !important; height: auto !important; display: block; image-rendering: pixelated; }

        #debug-console {
            width: 100%; max-width: 360px; height: 120px; background: #000; border: 1px solid #333;
            border-radius: 6px; font-family: monospace; font-size: 11px; color: #888;
            padding: 8px; overflow-y: auto; text-align: left; margin-top: 20px; white-space: pre-wrap;
        }

        #chat-interface {
            display: none;
            width: 100vw;
            max-width: none;
            height: var(--app-height);
            background: var(--bg);
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            transform: none;
            z-index: 100;
            overflow: hidden;
        }

        #chat-header {
            min-height: calc(56px + env(safe-area-inset-top));
            flex: 0 0 auto;
            border-bottom: 1px solid var(--border);
            padding: env(safe-area-inset-top) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
        }
        .status-container { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .status-stack { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        #network-detail { font-size: 0.62rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70vw; }
        .status-text { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; }
        #status-dot { width: 6px; height: 6px; border-radius: 50%; transition: all 0.3s; }

        #btn-leave { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; background: transparent; border: none; width: auto; padding: 4px 8px; }
        #relay-fallback-bar { display: none; flex: 0 0 auto; padding: 10px 12px; border-top: 1px solid var(--border); background: rgba(255, 180, 0, 0.05); }
        #relay-fallback-note { font-size: 0.72rem; color: var(--text-muted); line-height: 1.45; margin-bottom: 8px; }
        #btn-use-relay { border-color: rgba(255, 180, 0, 0.45); color: var(--warning); padding: 9px 12px; font-size: 0.78rem; }

        #chat-messages {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 24px clamp(16px, 3vw, 48px);
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg);
        }
        .msg { max-width: min(72%, 760px); padding: 10px 14px; font-size: 0.92rem; line-height: 1.45; word-break: break-word; }
        .msg.system { background: transparent; color: var(--text-muted); align-self: center; text-align: center; font-size: 0.75rem; max-width: 90%; }
        .msg.me { background: var(--panel); color: #FFF; align-self: flex-end; border-radius: 14px 14px 2px 14px; border: 1px solid var(--border); }
        .msg.friend { background: transparent; color: var(--text); align-self: flex-start; border-radius: 14px 14px 14px 2px; border: 1px solid var(--border); }

        #chat-input-area {
            flex: 0 0 auto;
            padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            background: var(--bg);
            gap: 12px;
        }
        #input-msg { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border); padding: 12px 16px; color: #FFF; font-size: 16px; border-radius: 20px; }
        #input-msg:focus { outline: none; border-color: rgba(0, 255, 204, 0.4); }
        #btn-send { background: transparent; color: var(--accent); border: none; padding: 8px 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; width: auto; flex: 0 0 auto; }

        @media (max-width: 767px) {
            #pin-container, #setup-container { max-width: 420px; padding-left: 18px; padding-right: 18px; }
            #chat-header { padding-left: max(14px, env(safe-area-inset-left)); padding-right: max(14px, env(safe-area-inset-right)); }
            #chat-messages { padding: 16px 14px; gap: 12px; }
            .msg { max-width: 84%; }
            #chat-input-area { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); gap: 8px; }
            #network-detail { max-width: 58vw; }
        }

        @media (min-width: 768px) {
            #pin-container, #setup-container { max-width: 520px; }
            #debug-console { max-width: none; }
            #chat-messages { padding-left: clamp(28px, 5vw, 72px); padding-right: clamp(28px, 5vw, 72px); }
            #chat-input-area { padding-left: clamp(28px, 5vw, 72px); padding-right: clamp(28px, 5vw, 72px); }
            #chat-header { padding-left: clamp(28px, 5vw, 72px); padding-right: clamp(28px, 5vw, 72px); }
            .msg { max-width: min(68%, 760px); }
        }
    </style>
</head>
<body>

    <div id="pin-container">
        <h1>🔐 身分驗證安全鎖</h1>
        <div class="subtitle" id="pin-tip">請輸入或設定至少 8 位安全密碼</div>
        <div class="pin-wrapper">
            <input type="password" id="pin-input" class="pin-input" placeholder="輸入解鎖密碼">
        </div>
        <label class="show-pin-label">
            <input type="checkbox" id="checkbox-show-pin"> 顯示密碼
        </label>
        <button id="btn-unlock">確認解鎖 / 初始化身份</button>

        <div class="divider">
            <span class="divider-text">忘記 PIN 碼？</span>
        </div>
        <button id="btn-reset-identity" class="btn-danger-link">物理重置身分與聊天紀錄</button>
    </div>

    <div id="setup-container">
        <h1>📟 P2P Chat</h1>
        <div class="subtitle">去中心化・本地端對端加密通訊</div>

        <div class="relay-board">
            <div class="relay-title">📡 Relay Matrix</div>
            <div class="relay-item"><span>nos.lol</span><span id="relay-0" class="relay-status fail">⏳ SYNC</span></div>
            <div class="relay-item"><span>relay.damus.io</span><span id="relay-1" class="relay-status fail">⏳ SYNC</span></div>
            <div class="relay-item"><span>relay.primal.net</span><span id="relay-2" class="relay-status fail">⏳ SYNC</span></div>
            <div class="relay-item"><span>relay.nostr.band</span><span id="relay-3" class="relay-status fail">⏳ SYNC</span></div>
        </div>

        <div class="conversation-section">
            <div class="conversation-heading">
                <span class="conversation-title">對話</span>
                <span id="chat-count">0</span>
            </div>
            <div id="chat-list"></div>
            <button id="btn-new-chat">＋ 新增對話</button>
            <div id="pair-actions" class="btn-group">
                <button id="btn-create">產生邀請 QR Code</button>
                <button id="btn-scan">掃描對方 QR Code</button>
            </div>
        </div>
        <div id="debug-console">系統初始化中...</div>
    </div>

    <div id="qrcode-container"></div>
    <div id="reader"></div>

    <div id="chat-interface">
        <div id="chat-header">
            <div class="status-container">
                <div id="status-dot"></div>
                <div class="status-stack">
                    <span id="chat-peer-name">對話</span>
                    <span id="status-text" class="status-text">IDLE</span>
                    <span id="network-detail">ICE: INITIALIZING</span>
                </div>
            </div>
            <button id="btn-leave">[ 返回 ]</button>
        </div>
        <div id="chat-messages"></div>
        <div id="relay-fallback-bar">
            <div id="relay-fallback-note">Direct P2P 目前無法建立。只有你主動選擇後，才會改用端對端加密的 TURN Relay。</div>
            <button id="btn-use-relay">使用加密 Relay 連線</button>
        </div>
        <div id="chat-input-area">
            <input type="text" id="input-msg" placeholder="輸入訊息..." autocomplete="off">
            <button id="btn-send">發送</button>
        </div>
    </div>

    <script>
        (function() {
            const root = document.documentElement;
            const input = document.getElementById('input-msg');
            const messages = document.getElementById('chat-messages');
            let viewportRaf = 0;
            let lastHeight = 0;

            function applyViewport() {
                viewportRaf = 0;
                const vv = window.visualViewport;
                const height = Math.round(vv ? vv.height : window.innerHeight);
                if (height === lastHeight) return;

                const bottomGap = messages
                    ? Math.max(0, messages.scrollHeight - messages.scrollTop - messages.clientHeight)
                    : 0;
                const keepAtBottom = document.activeElement === input && bottomGap < 96;

                lastHeight = height;
                root.style.setProperty('--app-height', `${height}px`);

                if (keepAtBottom && messages) {
                    requestAnimationFrame(function() {
                        messages.scrollTop = Math.max(0, messages.scrollHeight - messages.clientHeight - bottomGap);
                    });
                }
            }

            function scheduleViewportSync() {
                if (viewportRaf) return;
                viewportRaf = requestAnimationFrame(applyViewport);
            }

            scheduleViewportSync();
            window.addEventListener('resize', scheduleViewportSync, { passive: true });
            window.addEventListener('orientationchange', scheduleViewportSync, { passive: true });

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', scheduleViewportSync, { passive: true });
                window.visualViewport.addEventListener('scroll', scheduleViewportSync, { passive: true });
            }

            input.addEventListener('focus', function() {
                scheduleViewportSync();
            });

            input.addEventListener('blur', function() {
                scheduleViewportSync();
            });
        })();
    </script>

    <script type="module">
        const versionStamp = "20260815-v22-ios-offset-fix";
        import(`./js/app.js?v=${versionStamp}`).catch(console.error);
    </script>
</body>
</html>
