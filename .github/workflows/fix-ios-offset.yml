name: Fix iOS viewport offset
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/fix_offset_patch.py
      - run: |
          git config user.name "Danny"
          git config user.email "danny950811@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix iOS keyboard offset jump"
          git push
