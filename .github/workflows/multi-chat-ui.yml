name: Apply multi-chat UI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message != 'Implement multi-chat conversation list'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/multi_chat_patch.py
      - name: Check JavaScript
        run: node --check js/app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/app.js
          git commit -m "Implement multi-chat conversation list"
          git push
