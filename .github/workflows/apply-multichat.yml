name: Apply multichat background patch
on:
  push:
    branches: [work-multichat-background]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-multichat-background
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/multichat_patch.py
      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/nostr.js
      - name: Commit patched files
        run: |
          git config user.name "Danny"
          git config user.email "danny950811@gmail.com"
          git add js/app.js js/nostr.js README.md
          git diff --cached --quiet && exit 0
          git commit -m "Add background multichat connections and fast Nostr readiness"
          git push
