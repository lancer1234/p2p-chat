name: Apply foreground recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/foreground_recovery_patch.py
      - run: node --check js/app.js
      - run: |
          git config user.name "Danny"
          git config user.email "danny950811@gmail.com"
          git add js/app.js
          git diff --cached --quiet && exit 0
          git commit -m "Recover P2P sessions after iOS backgrounding"
          git push
